name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      paperreader_sdk_ref:
        description: Immutable 40-character PaperReader SDK commit (defaults to repository variable)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PAPERREADER_SDK_REF: ${{ github.event.inputs.paperreader_sdk_ref || vars.PAPERREADER_SDK_REF }}

    steps:
      - name: Check out source extensions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Require immutable SDK commit
        run: |
          python3 - <<'PY'
          import os
          import re
          if re.fullmatch(r"[0-9a-f]{40}", os.environ.get("PAPERREADER_SDK_REF", "")) is None:
              raise SystemExit("PAPERREADER_SDK_REF must be a full lowercase commit SHA")
          PY

      - name: Check out PaperReader extension API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ImAno177/PaperReader
          path: PaperReader
          ref: ${{ env.PAPERREADER_SDK_REF }}

      - name: Verify checked-out SDK commit
        run: test "$(git -C PaperReader rev-parse HEAD)" = "$PAPERREADER_SDK_REF"

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520

      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          python3 - <<'PY'
          import tomllib
          import subprocess
          with open("PaperReader/gradle/libs.versions.toml", "rb") as catalog:
              versions = tomllib.load(catalog)["versions"]
          subprocess.run([
              "sdkmanager",
              f"platforms;android-{versions['compileSdk']}.0",
              f"build-tools;{versions['buildTools']}",
          ], check=True)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build for CodeQL extraction
        run: >-
          ./gradlew
          -PpaperReaderSdkPath=PaperReader
          assembleDebug
          --no-daemon
          --no-configuration-cache
          --no-build-cache
          --stacktrace

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:java-kotlin
