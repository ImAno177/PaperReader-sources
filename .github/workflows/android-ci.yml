name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sources-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ImAno177/PaperReader
          path: PaperReader
          ref: ${{ vars.PAPERREADER_SDK_REF || 'main' }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - uses: gradle/actions/dependency-submission@4733eaac7c1b0da527e4206b7671e0061de1ce37
        with:
          additional-arguments: -PpaperReaderSdkPath=PaperReader --no-configuration-cache
          cache-provider: basic
          dependency-graph: generate-and-submit

  dependency-review:
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@56339e523c0409420f6c2c9a2f4292bbb3c07dd3
        with:
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
          # Build plugins are development-scope; never allow a vulnerable runtime dependency.
          fail-on-scopes: runtime
          # AGP's build-only sdk-common -> commons-compress graph currently resolves
          # commons-lang3 3.16.0 (GHSA-j288-q9x7-2f5v). The app/source APKs do not
          # package this graph. Keep this exact advisory allowlisted until AGP ships
          # the fixed transitive version; runtime findings still fail the check.
          allow-ghsas: GHSA-j288-q9x7-2f5v

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ImAno177/PaperReader
          path: PaperReader
          ref: ${{ vars.PAPERREADER_SDK_REF || 'main' }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Test, lint, and assemble
        run: >-
          ./gradlew
          -PpaperReaderSdkPath=PaperReader
          testDebugUnitTest lintDebug assembleDebug
          --stacktrace
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: paperreader-sources-${{ github.sha }}.spdx.json
          artifact-name: paperreader-sources-sbom-${{ github.sha }}
          syft-version: v1.51.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-apks-${{ github.sha }}
          path: source-*/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
