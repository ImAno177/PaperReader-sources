name: Android CI

on:
  workflow_dispatch:
    inputs:
      paperreader_sdk_ref:
        description: Immutable 40-character PaperReader SDK commit (defaults to repository variable)
        required: false
        type: string
  workflow_call:
    inputs:
      paperreader_sdk_ref:
        description: Immutable 40-character PaperReader SDK commit (defaults to repository variable)
        required: false
        type: string

permissions:
  contents: read

jobs:
  dependency-submission:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PAPERREADER_SDK_REF: ${{ inputs.paperreader_sdk_ref || vars.PAPERREADER_SDK_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require immutable SDK commit
        run: |
          python3 - <<'PY'
          import os
          import re
          if re.fullmatch(r"[0-9a-f]{40}", os.environ.get("PAPERREADER_SDK_REF", "")) is None:
              raise SystemExit("PAPERREADER_SDK_REF must be a full lowercase commit SHA")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Check out the pinned PaperReader SDK
        with:
          repository: ImAno177/PaperReader
          path: PaperReader
          ref: ${{ env.PAPERREADER_SDK_REF }}
      - name: Verify checked-out SDK commit
        run: test "$(git -C PaperReader rev-parse HEAD)" = "$PAPERREADER_SDK_REF"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
      - name: Install host-catalog Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          python3 - <<'PY'
          import tomllib
          import subprocess
          with open("PaperReader/gradle/libs.versions.toml", "rb") as catalog:
              versions = tomllib.load(catalog)["versions"]
          subprocess.run([
              "sdkmanager",
              f"platforms;android-{versions['compileSdk']}.0",
              f"build-tools;{versions['buildTools']}",
          ], check=True)
          PY
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          additional-arguments: -PpaperReaderSdkPath=PaperReader --no-configuration-cache
          cache-provider: basic
          dependency-graph: generate-and-submit
          # Submit only code packaged into extension APKs. The default graph also
          # includes the composite PaperReader SDK build and its host dependencies.
          dependency-graph-include-projects: ":source-.*"
          dependency-graph-include-configurations: ".*[Rr]eleaseRuntimeClasspath"

  dependency-review:
    needs: dependency-submission
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          # Runs are on demand, so the main base may have no dependency snapshot.
          # Review the complete head runtime graph immediately instead of waiting
          # for a baseline that may never appear.
          base-ref: main
          head-ref: ${{ github.sha }}
          retry-on-snapshot-warnings: false
          # Build plugins are development-scope; never allow a vulnerable runtime dependency.
          fail-on-scopes: runtime
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PAPERREADER_SDK_REF: ${{ inputs.paperreader_sdk_ref || vars.PAPERREADER_SDK_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require immutable SDK commit
        run: |
          python3 - <<'PY'
          import os
          import re
          if re.fullmatch(r"[0-9a-f]{40}", os.environ.get("PAPERREADER_SDK_REF", "")) is None:
              raise SystemExit("PAPERREADER_SDK_REF must be a full lowercase commit SHA")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Check out the pinned PaperReader SDK
        with:
          repository: ImAno177/PaperReader
          path: PaperReader
          ref: ${{ env.PAPERREADER_SDK_REF }}
      - name: Verify checked-out SDK commit
        run: test "$(git -C PaperReader rev-parse HEAD)" = "$PAPERREADER_SDK_REF"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
      - name: Install host-catalog Android SDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          python3 - <<'PY'
          import tomllib
          import subprocess
          with open("PaperReader/gradle/libs.versions.toml", "rb") as catalog:
              versions = tomllib.load(catalog)["versions"]
          subprocess.run([
              "sdkmanager",
              f"platforms;android-{versions['compileSdk']}.0",
              f"build-tools;{versions['buildTools']}",
          ], check=True)
          PY
      - name: Verify source descriptor and registry metadata parity
        run: python3 scripts/test_registry_contract.py PaperReader
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Test, lint, and assemble
        run: >-
          ./gradlew
          -PpaperReaderSdkPath=PaperReader
          testDebugUnitTest lintDebug assembleDebug
          --stacktrace
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: paperreader-sources-${{ github.sha }}.spdx.json
          artifact-name: paperreader-sources-sbom-${{ github.sha }}
          syft-version: v1.51.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-apks-${{ github.sha }}
          path: source-*/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
