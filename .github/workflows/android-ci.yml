name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sources-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ImAno177/PaperReader
          path: PaperReader
          ref: ${{ vars.PAPERREADER_SDK_REF || 'main' }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          additional-arguments: -PpaperReaderSdkPath=PaperReader --no-configuration-cache
          cache-provider: basic
          dependency-graph: generate-and-submit
          # Submit only code packaged into extension APKs. The default graph also
          # includes the composite PaperReader SDK build and its host dependencies.
          dependency-graph-include-projects: ":source-.*"
          dependency-graph-include-configurations: ".*[Rr]eleaseRuntimeClasspath"

  dependency-review:
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          # Release registry commits made with GITHUB_TOKEN do not trigger a new
          # workflow, so their exact base SHA may not have a dependency snapshot.
          # In that case review the complete head runtime graph immediately instead
          # of waiting ten minutes for a baseline that cannot appear.
          retry-on-snapshot-warnings: false
          # Build plugins are development-scope; never allow a vulnerable runtime dependency.
          fail-on-scopes: runtime
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ImAno177/PaperReader
          path: PaperReader
          ref: ${{ vars.PAPERREADER_SDK_REF || 'main' }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Test, lint, and assemble
        run: >-
          ./gradlew
          -PpaperReaderSdkPath=PaperReader
          testDebugUnitTest lintDebug assembleDebug
          --stacktrace
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: paperreader-sources-${{ github.sha }}.spdx.json
          artifact-name: paperreader-sources-sbom-${{ github.sha }}
          syft-version: v1.51.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-apks-${{ github.sha }}
          path: source-*/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
