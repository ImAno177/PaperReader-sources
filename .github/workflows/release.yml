name: Release source extensions

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version without the v prefix
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android/store version code
        required: true
        type: number

permissions:
  contents: write

concurrency:
  group: source-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ImAno177/PaperReader
          path: PaperReader
          ref: ${{ vars.PAPERREADER_SDK_REF || 'main' }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.EXTENSION_KEYSTORE_BASE64 }}
          INDEX_KEY_BASE64: ${{ secrets.REGISTRY_ED25519_PRIVATE_KEY_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/extensions.jks"
          printf '%s' "$INDEX_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/index-key.pem"
          chmod 600 "$RUNNER_TEMP/extensions.jks" "$RUNNER_TEMP/index-key.pem"
      - name: Build signed release APKs
        env:
          STORE_PASSWORD: ${{ secrets.EXTENSION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EXTENSION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EXTENSION_KEY_PASSWORD }}
          HOST_SIGNER: ${{ secrets.PAPERREADER_HOST_SIGNER_SHA256 }}
        run: >-
          ./gradlew
          -PpaperReaderSdkPath=PaperReader
          -PreleaseVersion=${{ inputs.version_name }}
          -PreleaseVersionCode=${{ inputs.version_code }}
          -PpaperReaderHostSignerSha256="$HOST_SIGNER"
          -PextensionKeystorePath="$RUNNER_TEMP/extensions.jks"
          -PextensionKeystorePassword="$STORE_PASSWORD"
          -PextensionKeyAlias="$KEY_ALIAS"
          -PextensionKeyPassword="$KEY_PASSWORD"
          testDebugUnitTest lintRelease assembleRelease
          --stacktrace
      - name: Build signed store index
        run: |
          mkdir -p dist
          for module in source-semanticscholar source-crossref source-arxiv source-europepmc; do
            cp "$module/build/outputs/apk/release/$module-release.apk" "dist/$module.apk"
          done
          SIGNER=$(apksigner verify --print-certs dist/source-semanticscholar.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test ${#SIGNER} -eq 64
          python3 scripts/build_registry.py \
            --root . \
            --version-name "${{ inputs.version_name }}" \
            --version-code "${{ inputs.version_code }}" \
            --release-tag "v${{ inputs.version_name }}" \
            --signer-sha256 "$SIGNER" \
            --private-key "$RUNNER_TEMP/index-key.pem" \
            --output dist/index.signed.json
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
        with: { syft-version: v1.51.0 }
      - run: syft dir:. -o spdx-json=dist/paperreader-sources-${{ inputs.version_name }}.spdx.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ inputs.version_name }}"
          dist/source-semanticscholar.apk
          dist/source-crossref.apk
          dist/source-arxiv.apk
          dist/source-europepmc.apk
          dist/index.signed.json
          dist/paperreader-sources-${{ inputs.version_name }}.spdx.json
          --title "PaperReader sources v${{ inputs.version_name }}"
          --generate-notes
          --target main
      - name: Publish latest signed index
        run: |
          git checkout main
          cp dist/index.signed.json registry/index.signed.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add registry/index.signed.json
          git commit -m "chore(registry): publish v${{ inputs.version_name }}"
          git push origin main
