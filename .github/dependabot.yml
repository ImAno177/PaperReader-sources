version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies"]
    reviewers: ["ImAno177"]
    assignees: ["ImAno177"]
    commit-message: { prefix: "deps" }
    groups:
      gradle-minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      gradle-security:
        applies-to: "security-updates"
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels: ["dependencies"]
    reviewers: ["ImAno177"]
    assignees: ["ImAno177"]
    commit-message: { prefix: "deps" }
    groups:
      actions-minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
